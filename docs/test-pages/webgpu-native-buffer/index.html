<!doctype html><title>Pad WebGPU probe</title><canvas width="256" height="256" id="c"></canvas><button onclick="run()">Run WebGPU probe</button><pre id="status"></pre><script>
async function run(){
const r={secure:isSecureContext,api:!!navigator.gpu,errors:[]};window.result=r;
try{
if(!navigator.gpu)return r;
const a=await navigator.gpu.requestAdapter();r.adapter=!!a;if(!a)return r;
r.info={vendor:a.info.vendor,architecture:a.info.architecture,device:a.info.device,description:a.info.description};
const d=await a.requestDevice();r.device=true;d.lost.then(x=>r.lost={reason:x.reason,message:x.message});d.onuncapturederror=e=>r.errors.push(e.error.message);
const s=d.createBuffer({size:16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});const b=d.createBuffer({size:256,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
const p=d.createComputePipeline({layout:'auto',compute:{module:d.createShaderModule({code:'@group(0) @binding(0) var<storage,read_write> x:array<u32>; @compute @workgroup_size(4) fn main(@builtin(global_invocation_id) id:vec3u){x[id.x]=id.x*7u+3u;}'}),entryPoint:'main'}});
const e=d.createCommandEncoder();const pass=e.beginComputePass();pass.setPipeline(p);pass.setBindGroup(0,d.createBindGroup({layout:p.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:s}}]}));pass.dispatchWorkgroups(1);pass.end();e.copyBufferToBuffer(s,0,b,0,16);d.queue.submit([e.finish()]);await b.mapAsync(GPUMapMode.READ);r.compute=Array.from(new Uint32Array(b.getMappedRange().slice(0,16)));b.unmap();r.computePass=JSON.stringify(r.compute)==='[3,10,17,24]';
const ctx=c.getContext('webgpu');r.context=!!ctx;ctx.configure({device:d,format:navigator.gpu.getPreferredCanvasFormat(),alphaMode:'opaque'});
for(let i=0;i<60;i++){await new Promise(requestAnimationFrame);const en=d.createCommandEncoder();const t=ctx.getCurrentTexture();const pa=en.beginRenderPass({colorAttachments:[{view:t.createView(),clearValue:{r:0,g:1,b:0,a:1},loadOp:'clear',storeOp:'store'}]});pa.end();d.queue.submit([en.finish()]);}await d.queue.onSubmittedWorkDone();r.renderSubmitted=true;
await new Promise(x=>setTimeout(x,1000));r.pass=r.computePass&&r.renderSubmitted&&!r.lost&&!r.errors.length;
}catch(e){r.error=String(e);r.pass=false}document.getElementById("status").textContent=JSON.stringify(r,null,2);return r;}
</script>
