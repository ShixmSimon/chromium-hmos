<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选择文件</title>
<body style="margin:16px;font-family:sans-serif;font-size:18px">
<input id="f" type="file">
<pre id="out"></pre>
<script>
document.getElementById('f').onchange = e => {
  const file = e.target.files[0];
  document.getElementById('out').textContent = file ? `${file.name} ${file.size} bytes` : 'none';
};
</script>
</body>
