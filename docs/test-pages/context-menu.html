<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长按菜单</title>
<body style="margin:16px;font-family:sans-serif;font-size:18px">
<h3>长按菜单</h3>
<p><a id="link" href="https://example.com/long-press">长按这个链接</a></p>
<p><img id="img" src="qr-sample.png" width="160" alt="图片"></p>
<p id="text">长按这段文字会选中文字并出现文字菜单。</p>
<p><input id="input" value="输入框里的文字" style="font-size:18px;width:90%"></p>
<p><video id="video" src="sample-720p.mp4" controls loop muted playsinline width="300"></video></p>
</body>
