name: Inspect runtime sources

on:
  push:
    branches: [hmos-154-adapter, hmos-154-dev]
    paths: ['.github/workflows/inspect-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

# Read the same tree between builds, never while overlay/patch sync is active.
concurrency:
  group: chromium-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: [self-hosted, harmonyos-chromium]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read startup and utility sources
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          root = Path(os.environ.get('CHROMIUM_SRC', '/root/chromium-154/src'))
          paths = '''
          out/ohos_arm64/args.gn
          chrome/browser/BUILD.gn
          chrome/browser/chrome_content_browser_client_navigation_throttles.cc
          content/public/browser/navigation_throttle.h
          content/public/browser/back_forward_cache.h
          content/public/browser/web_contents.h
          crypto/hash.h
          crypto/sha2.h
          crypto/signature_verifier.h
          services/network/public/cpp/simple_url_loader.h
          services/network/public/cpp/resource_request.h
          services/network/public/mojom/client_security_state.mojom
          services/network/public/mojom/local_network_access_check.mojom
          services/network/public/mojom/url_loader_factory.mojom
          services/network/url_loader.cc
          services/network/local_network_access_checker.cc
          net/base/registry_controlled_domains/registry_controlled_domain.h
          url/url_canon.h
          chrome/browser/profiles/profile.h
          content/public/browser/storage_partition.h
          base/files/important_file_writer.h
          base/base64.h
          third_party/boringssl/src/include/openssl/curve25519.h
          components/update_client/network_impl.cc
          components/security_interstitials/core/browser/resources/interstitial_large.js
          out/ohos_arm64/gen/media/media_buildflags.h
          media/media_options.gni
          media/base/supported_types.cc
          media/base/mime_util_internal.cc
          media/base/video_codecs.cc
          media/filters/decoder_selector.cc
          media/renderers/default_decoder_factory.cc
          third_party/libyuv/include/libyuv/planar_functions.h
          gpu/ipc/service/gpu_channel_shared_image_interface.h
          gpu/ipc/service/gpu_channel_shared_image_interface.cc
          gpu/ipc/service/gpu_channel.h
          gpu/command_buffer/service/shared_image/ozone_image_backing.h
          gpu/command_buffer/service/shared_image/ozone_image_backing.cc
          gpu/command_buffer/common/shared_image_info.h
          ui/gfx/native_pixmap.h
          ui/gfx/gpu_fence.h
          ui/gfx/gpu_fence_handle.h
          media/base/video_frame_metadata.h
          media/base/video_frame.h
          media/base/video_frame.cc
          media/gpu/BUILD.gn
          media/gpu/mac/video_toolbox_frame_converter.h
          media/gpu/mac/video_toolbox_frame_converter.cc
          media/gpu/android/direct_shared_image_video_provider.cc
          media/gpu/android/shared_image_video_provider.h
          media/gpu/chromeos/platform_video_frame_pool.h
          media/gpu/chromeos/platform_video_frame_pool.cc
          media/mojo/services/BUILD.gn
          media/mojo/services/gpu_mojo_media_client.h
          media/mojo/services/gpu_mojo_media_client.cc
          media/mojo/services/gpu_mojo_media_client_mac.cc
          media/mojo/mojom/video_frame_mojom_traits.cc
          media/mojo/services/mojo_video_decoder_service.cc
          gpu/ipc/service/command_buffer_stub.h
          gpu/ipc/service/shared_image_stub.h
          gpu/command_buffer/service/shared_image/shared_image_factory.h
          gpu/command_buffer/service/shared_image/shared_image_factory.cc
          gpu/command_buffer/service/shared_image/ozone_image_backing_factory.cc
          gpu/command_buffer/service/shared_image/shared_image_manager.h
          gpu/command_buffer/service/shared_image/shared_image_representation.h
          gpu/command_buffer/client/shared_image_interface.h
          gpu/command_buffer/client/shared_image_interface_in_process.h
          gpu/command_buffer/client/client_shared_image.h
          ui/gfx/native_pixmap_handle.h
          ui/ozone/public/surface_factory_ozone.h
          base/memory/platform_shared_memory_region_posix.cc
          base/memory/platform_shared_memory_region.h
          base/memory/platform_shared_memory_region_unittest.cc
          base/files/file_util_posix.cc
          base/posix/scoped_fd.h
          base/process/kill_posix.cc
          base/process/process_posix.cc
          base/process/process_handle_linux.cc
          base/file_descriptor_store.h
          base/file_descriptor_store.cc
          components/password_manager/core/browser/import/password_importer.h
          components/password_manager/core/browser/import/password_importer_unittest.cc
          components/password_manager/core/browser/import/import_results.h
          content/public/common/content_descriptor_keys.cc
          base/path_service.cc
          base/path_service.h
          base/posix/global_descriptors.h
          base/i18n/icu_util.cc
          base/message_loop/message_pump_default.cc
          base/synchronization/waitable_event_posix.cc
          chrome/app/chrome_main_delegate.cc
          chrome/common/chrome_descriptors.h
          chrome/utility/services.cc
          chrome/utility/chrome_content_utility_client.cc
          content/app/content_main.cc
          content/app/content_main_runner_impl.cc
          content/browser/child_process_launcher_helper_posix.cc
          content/child/child_thread_impl.cc
          content/common/child_process_host_impl.cc
          content/utility/utility_main.cc
          content/utility/utility_thread_impl.cc
          content/public/common/content_descriptors.h
          content/public/common/content_descriptor_keys.h
          components/password_manager/services/csv_password/csv_password_parser_impl.cc
          components/password_manager/core/browser/import/password_importer.cc
          components/password_manager/core/browser/import/csv_password_sequence.cc
          ui/base/resource/resource_bundle.cc
          ui/base/resource/resource_bundle.h
          ui/base/resource/resource_bundle_posix.cc
          '''.split()
          manifest = {'revision': subprocess.check_output(
              ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip(),
              'files': {}, 'missing': []}
          output = Path(os.environ['RUNNER_TEMP']) / 'runtime-source-snapshot'
          output.mkdir(exist_ok=True)
          with tarfile.open(output / 'sources.tar.gz', 'w:gz', dereference=True) as archive:
              for name in paths:
                  source = root / name
                  if not source.is_file():
                      manifest['missing'].append(name)
                      continue
                  manifest['files'][name] = hashlib.sha256(source.read_bytes()).hexdigest()
                  archive.add(source, arcname=name)
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f"Captured {len(manifest['files'])} source files; missing: {manifest['missing']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-source-snapshot
          path: ${{ runner.temp }}/runtime-source-snapshot/
          retention-days: 7
