name: Adapter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public tree
        run: scripts/verify-public-tree.sh
      - name: Check scripts
        run: bash -n scripts/*.sh
      - name: Apply adapter to pinned Chromium
        env:
          REQUIRE_COMPATIBLE: '1'
        run: >-
          scripts/check-upstream-adapter.sh
          154.0.8037.51
          743f26418a267dd97c3c1c71d786038ae68cfc8f
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-adapter-report
          path: upstream-compatibility.md
