name: Inspect media artwork interfaces

on:
  push:
    branches: [hmos-154-adapter]
    paths: ['.github/workflows/inspect-media-artwork.yml']

concurrency:
  group: chromium-build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, harmonyos-chromium]
    timeout-minutes: 10
    steps:
      - name: Collect interface snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d "${RUNNER_TEMP}/media-artwork.XXXXXX")
          echo "ARTWORK_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          src=/root/chromium-154/src
          sdk=/root/harmonyos-clt/sdk/default/openharmony/native/sysroot/usr/include
          for relative in \
            components/system_media_controls/BUILD.gn \
            components/system_media_controls/system_media_controls.h \
            content/browser/media/system_media_controls/system_media_controls_notifier.cc \
            content/browser/media/system_media_controls/system_media_controls_notifier.h \
            chrome/browser/media/chrome_media_session_client.cc \
            ui/gfx/codec/png_codec.h \
            skia/ext/image_operations.h; do
            mkdir -p "$snapshot/src/$(dirname "$relative")"
            cp "$src/$relative" "$snapshot/src/$relative"
          done
          for relative in \
            multimedia/av_session/native_avmetadata.h \
            multimedia/av_session/native_avsession.h \
            filemanagement/file_uri/oh_file_uri.h; do
            mkdir -p "$snapshot/sdk/$(dirname "$relative")"
            cp "$sdk/$relative" "$snapshot/sdk/$relative"
          done
          git -C "$src" rev-parse HEAD > "$snapshot/chromium-revision.txt"
          sha256sum "$src/components/system_media_controls/BUILD.gn" \
            "$src/content/browser/media/system_media_controls/system_media_controls_notifier.cc" \
            > "$snapshot/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: media-artwork-interfaces
          path: ${{ env.ARTWORK_SNAPSHOT }}
          retention-days: 3
